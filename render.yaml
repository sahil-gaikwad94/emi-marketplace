services:
  - type: web
    name: emi-marketplace
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm db:seed && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
